<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" class="w-auto h-full">
  <!-- Modern Industrial Pipe / Power Hexagon Emblem -->
  <g transform="translate(4, 5)">
    <!-- Outer Hex Ring with Pipe Chamfer -->
    <path d="M30 3 L54 17 L54 43 L30 57 L6 43 L6 17 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner Concentric Pipe Flow / Core -->
    <circle cx="30" cy="30" r="17" fill="url(#coreGradientDark)" stroke="#38BDF8" stroke-width="2" />
    <circle cx="30" cy="30" r="8" fill="#030712" stroke="#F97316" stroke-width="2.5" />
    
    <!-- Flow Direction Accents -->
    <path d="M30 13 L30 18" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M30 42 L30 47" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M15 30 L20 30" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M40 30 L45 30" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: THE MONK POWER INDIA -->
  <text x="75" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="21" fill="#FFFFFF" letter-spacing="0.08em">THE MONK POWER</text>
  
  <text x="76" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" letter-spacing="0.28em">INDIA</text>
  
  <line x1="126" y1="48" x2="295" y2="48" stroke="#334155" stroke-width="1" />
  <text x="135" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" fill="#94A3B8" letter-spacing="0.16em">PIPES &amp; POLYMERS</text>

  <defs>
    <linearGradient id="coreGradientDark" x1="13" y1="13" x2="47" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
</svg>
